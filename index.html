<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airsoft IMS - Belépés</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #242424;
            --accent-color: #5c8a36; /* Airsoft zöld */
            --accent-hover: #466929;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --danger-color: #bd3a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 5px;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input {
            background-color: #111;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .error-msg {
            color: var(--danger-color);
            background-color: rgba(189, 58, 58, 0.1);
            border: 1px solid var(--danger-color);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .loading-spinner {
            display: none;
            color: var(--accent-color);
            font-weight: bold;
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Airsoft IMS</h1>
    <p>Raktárkezelő & Beszerzés Rendszer</p>

    <div id="errorBox" class="error-msg"></div>

    <div class="form-group">
        <label for="username">Felhasználónév</label>
        <input type="text" id="username" placeholder="pl. admin" autocomplete="off">
    </div>

    <div class="form-group">
        <label for="password">Jelszó</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button onclick="handleLogin()">Bejelentkezés</button>
    
    <div id="loadingStatus" class="loading-spinner">Ellenőrzés a MongoDB-ben...</div>
</div>

<script>
    // A Vercel API elérési utad
    const API_URL = "https://videkiboys-shop.vercel.app/api/server";

    async function handleLogin() {
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('errorBox');
        const loadingStatus = document.getElementById('loadingStatus');

        // Alap üzenetek elrejtése
        errorBox.style.display = 'none';

        if (!usernameInput || !passwordInput) {
            errorBox.innerText = "⚠️ Töltsd ki az összes mezőt!";
            errorBox.style.display = 'block';
            return;
        }

        loadingStatus.style.display = 'block';

        try {
            // Lekérés a Vercel backendre
            const response = await fetch(`${API_URL}?type=login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // SIKERES BELÉPÉS: Átirányítás a rendelési listára
                // Eltároljuk a nevet a biztonság kedvéért localstorage-ba
                localStorage.setItem('ims_user', data.displayName);
                window.location.href = "admin.html";
            } else {
                // HIBÁS BELÉPÉS (pl. 401-es hiba)
                errorBox.innerText = data.error || "⚠️ Hibás felhasználónév vagy jelszó!";
                errorBox.style.display = 'block';
            }

        } catch (error) {
            console.error("Bejelentkezési hiba:", error);
            errorBox.innerText = "❌ Hálózati hiba történt! A szerver nem elérhető.";
            errorBox.style.display = 'block';
        } finally {
            loadingStatus.style.display = 'none';
        }
    }

    // Enter gomb lenyomására is indítsa el a bejelentkezést
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });
</script>

</body>
</html>
