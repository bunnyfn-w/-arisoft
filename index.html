<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airsoft IMS</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #242424;
            --accent-color: #5c8a36; /* Airsoft zöld */
            --accent-hover: #466929;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --danger-color: #bd3a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* LOGIN FELÜLET STÍLUSA */
        .login-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 5px;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input {
            background-color: #111;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .error-msg {
            color: var(--danger-color);
            background-color: rgba(189, 58, 58, 0.1);
            border: 1px solid var(--danger-color);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        /* RENDELÉSI LISTA FELÜLET STÍLUSA */
        .main-container {
            width: 100%;
            max-width: 800px;
            display: none; /* Alapból rejtve van */
        }

        header {
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .panel h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .inline-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .inline-form input {
            flex: 1;
            min-width: 200px;
        }

        .inline-form button {
            width: auto;
            margin-top: 0;
            padding: 12px 24px;
        }

        .order-item {
            background-color: #1c1c1c;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .order-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }

        .btn-shop {
            background-color: var(--accent-color);
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .empty-message {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
            list-style: none;
        }
    </style>
</head>
<body>

<div id="loginSection" class="login-card">
    <h1>Airsoft IMS</h1>
    <p>Belépés a rendszerbe</p>
    <div id="errorBox" class="error-msg"></div>
    <div class="form-group">
        <label>Felhasználónév</label>
        <input type="text" id="username" placeholder="pl. admin">
    </div>
    <div class="form-group">
        <label>Jelszó</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    <button onclick="handleLogin()">Belépés</button>
</div>

<div id="mainSection" class="main-container">
    <header>
        <h1>Airsoft IMS</h1>
        <p>Üdvözlünk! Szükséges beszerzések listája</p>
    </header>

    <div class="panel">
        <h3>🛒 Új rendelendő termék hozzáadása</h3>
        <div class="inline-form">
            <input type="text" id="orderName" placeholder="Termék neve (pl. Specna Arms Mid-Cap tár)">
            <input type="url" id="orderLink" placeholder="Vásárlási link (https://...)">
            <button onclick="addOrder()">Hozzáadás</button>
        </div>
    </div>

    <div class="panel">
        <h3>📋 Aktuális rendelési lista</h3>
        <ul id="orderList">
            </ul>
    </div>
</div>

<script>
    // A TE IGAZI FŐ VERCELL LINKED:
    const API_URL = "https://videkiboys-shop.vercel.app/api/server";

    // BEJELENTKEZÉS KEZELÉSE
    async function handleLogin() {
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('errorBox');

        errorBox.style.display = 'none';

        if (!usernameInput || !passwordInput) {
            errorBox.innerText = "⚠️ Töltsd ki az összes mezőt!";
            errorBox.style.display = 'block';
            return;
        }

        try {
            const response = await fetch(`${API_URL}?type=login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // SIKER: Elrejtjük a logint, kirakjuk a listát
                document.getElementById('loginSection').style.display = 'none';
                
                // Középről felülre igazítjuk a tartalom elrendezését a képernyőn
                document.body.style.alignItems = 'flex-start';
                document.getElementById('mainSection').style.display = 'block';

                // Azonnal betöltjük a meglévő rendeléseket a MongoDB-ből
                loadOrders();
            } else {
                errorBox.innerText = data.error || "❌ Hibás adatok!";
                errorBox.style.display = 'block';
            }
        } catch (error) {
            errorBox.innerText = "❌ Hiba történt a szerverrel való kapcsolat során!";
            errorBox.style.display = 'block';
        }
    }

    // LISTA BETÖLTÉSE A MONGODB-BŐL
    async function loadOrders() {
        const listElement = document.getElementById('orderList');
        try {
            const response = await fetch(`${API_URL}?type=get_orders`);
            const orders = await response.json();
            listElement.innerHTML = '';

            if (orders.length === 0) {
                listElement.innerHTML = '<li class="empty-message">Nincs jelenleg rendelendő termék.</li>';
                return;
            }

            orders.forEach(item => {
                const li = document.createElement('li');
                li.className = 'order-item';
                li.innerHTML = `
                    <div class="order-info">
                        <span class="order-name">${item.name}</span>
                    </div>
                    <a href="${item.link}" target="_blank" class="btn-shop">Vásárlás ➔</a>
                `;
                listElement.appendChild(li);
            });
        } catch (error) {
            console.error(error);
        }
    }

    // ÚJ TERMÉK HOZZÁADÁSA
    async function addOrder() {
        const nameInput = document.getElementById('orderName');
        const linkInput = document.getElementById('orderLink');
        const name = nameInput.value.trim();
        let link = linkInput.value.trim();

        if (!name || !link) {
            alert("Töltsd ki a mezőket!");
            return;
        }

        if (!/^https?:\/\//i.test(link)) {
            link = 'https://' + link;
        }

        try {
            const response = await fetch(`${API_URL}?type=add_order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, link })
            });

            if (response.ok) {
                nameInput.value = '';
                linkInput.value = '';
                loadOrders();
            }
        } catch (error) {
            alert("Nem sikerült menteni!");
        }
    }

    // Enter gomb a loginhoz
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && document.getElementById('loginSection').style.display !== 'none') {
            handleLogin();
        }
    });
</script>
</body>
</html>
